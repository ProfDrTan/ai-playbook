<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Scrum Quiz × Principles | The AI Playbook</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2E4A;--panel:#163F63;--panel2:#1B4870;--cyan:#8FC7DE;--dim:#3E6683;--paper:#EAF3F8;--soft:#CFE4F0;--muted:#9FB6C9;--amber:#E8A63C;--coral:#D9694F;--green:#6FBF8B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--paper);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
background-image:repeating-linear-gradient(0deg,rgba(143,199,222,.05) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(143,199,222,.05) 0 1px,transparent 1px 32px)}
a{color:var(--cyan)}
main{max-width:960px;margin:0 auto;padding:44px 20px 90px}
.back{font-family:'IBM Plex Mono',monospace;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:22px}
h1{font-family:'IBM Plex Mono',monospace;font-size:clamp(26px,4.4vw,38px);line-height:1.2;margin-bottom:12px}
.sub{color:var(--soft);max-width:680px;margin-bottom:26px}
.meter{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--dim);margin-bottom:10px}
.meter div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--navy);cursor:pointer;border:0}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--soft);margin-bottom:28px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.c-covered{background:var(--green)}.c-partial{background:var(--amber)}.c-gap{background:var(--coral)}
.savers{background:var(--panel);border:1px solid var(--dim);border-radius:10px;padding:16px 20px;margin-bottom:24px}
.savers h2{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:6px;color:var(--amber);margin-bottom:6px}
.savers p{font-size:14px;color:var(--soft)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-items:center}
.bar button{font:500 13px 'IBM Plex Sans',sans-serif;background:transparent;color:var(--soft);border:1px solid var(--dim);border-radius:99px;padding:6px 14px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--amber);color:var(--navy);border-color:var(--amber);font-weight:700}
.bar .sep{width:1px;height:22px;background:var(--dim);margin:0 6px}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--dim);border-left:5px solid var(--dim);border-radius:10px;padding:16px 20px;margin-bottom:12px}
.card.covered{border-left-color:var(--green)}.card.partial{border-left-color:var(--amber)}.card.gap{border-left-color:var(--coral)}
.qhead{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.qn{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;color:var(--amber);min-width:44px}
.qt{font-size:12.5px;color:var(--muted)}
.cl{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--navy);background:var(--cyan);border-radius:4px;padding:1px 7px}
.qq{font-size:16px;margin-bottom:10px}
.ans{background:rgba(111,191,139,.12);border:1px solid rgba(111,191,139,.35);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.ans small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
td{padding:6px 8px;border-top:1px solid var(--dim);vertical-align:top}
td:first-child{font-weight:600;white-space:nowrap}
td:last-child{width:52px;text-align:right}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:12.5px;border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;padding:2px 8px}
.tag.prop{border-style:dashed;color:var(--amber);border-color:var(--amber)}
.tag.none{border-color:var(--coral);color:var(--coral)}
.note{font-size:14px;color:var(--soft)}
.hook{font-size:13.5px;margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(232,166,60,.1);border:1px solid rgba(232,166,60,.3)}
.hook b{color:var(--amber)}
.pblock{margin-bottom:22px}
.pblock h3{font-family:'IBM Plex Mono',monospace;font-size:16px;margin-bottom:4px}
.pblock h3 span{color:var(--amber)}
.pblock .cnt{font-size:13px;color:var(--muted);margin-bottom:10px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini a{font-family:'IBM Plex Mono',monospace;font-size:13px;text-decoration:none;padding:3px 9px;border-radius:6px;border:1px solid var(--dim);color:var(--paper)}
.mini a.covered{border-color:var(--green)}.mini a.partial{border-color:var(--amber)}.mini a.gap{border-color:var(--coral)}
#lock{max-width:420px;margin:80px auto;text-align:center}
#lock input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--dim);background:var(--panel);color:var(--paper);font-size:16px;margin:14px 0}
#lock button{padding:10px 20px;border-radius:8px;border:0;background:var(--amber);color:var(--navy);font-weight:700;font-size:15px;cursor:pointer}
#err{color:var(--coral);margin-top:10px;font-size:14px}
</style>
</head>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pass){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.SALT),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.IV)},k,b(P.CT));
 return JSON.parse(new TextDecoder().decode(pt));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CL={S:"S · Stories",A:"A · Artifacts",V:"V · Values",E:"E · Events",R:"R · Roles",Z:"S · Sustainability"};
const COV={covered:"Covered by the site",partial:"Partly covered",gap:"Not on the site"};
let D,view="q",fcov="all",fcl="all";
function ptag(p){const t=D.principles[p]||"";const prop=+p>=14;const none=p==="—";
 return `<span class="tag${prop?" prop":""}${none?" none":""}">${none?"No principle":"#"+p} ${esc(t.replace(" (proposed)",""))}${prop?" · proposed":""}</span>`}
function card(x){
 let h=`<article class="card ${x.cov}" id="q${x.n}"><div class="qhead"><span class="qn">Q${x.n}</span><span class="cl">${CL[x.c]}</span><span class="qt">${esc(x.t)} · ${COV[x.cov]}</span></div><div class="qq">${esc(x.q)}</div>`;
 if(x.pairs){h+=`<table>${x.pairs.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]==="—"?'<span style="color:var(--coral)">none</span>':"#"+r[2]}</td></tr>`).join("")}</table><div class="ans" style="font-weight:400">Distractor: <b>${esc(x.d)}</b><small>Each wrong pair costs 25%.</small></div>`}
 else h+=`<div class="ans">${esc(x.a)}</div>`;
 h+=`<div class="tags">${x.p.map(ptag).join("")}</div>`;
 if(x.note)h+=`<div class="note">${esc(x.note)}</div>`;
 if(x.h)h+=`<div class="hook"><b>Class hook.</b> ${esc(D.hooks[x.h])}</div>`;
 return h+"</article>"}
function render(){
 const qs=D.q.filter(x=>(fcov==="all"||x.cov===fcov)&&(fcl==="all"||x.c===fcl));
 const n=c=>D.q.filter(x=>x.cov===c).length;
 let h=`<h1>Scrum quiz, mapped to the principles</h1><p class="sub">All 30 questions of A1 Part C, each tied to the Scrum page principle that teaches it. Principles 14–17 are proposals, not yet on the student site. Quiz date: 19 October.</p>
 <div class="meter">${["covered","partial","gap"].map(c=>`<div class="c-${c}" style="flex:${n(c)}" data-cov="${c}" title="${COV[c]}">${n(c)}</div>`).join("")}</div>
 <div class="legend">${["covered","partial","gap"].map(c=>`<span><span class="dot c-${c}"></span>${COV[c]} (${n(c)})</span>`).join("")}</div>
 <div class="savers"><h2>SAVERS</h2><p>Stories · Artifacts · Values · Events · Roles · Sustainability. Every question sits under one letter.</p></div>
 <div class="bar" role="toolbar">
 ${[["q","By question"],["p","By principle"]].map(([v,l])=>`<button data-view="${v}" aria-pressed="${view===v}">${l}</button>`).join("")}<span class="sep"></span>
 ${[["all","All"],["covered","Covered"],["partial","Partial"],["gap","Gap"]].map(([v,l])=>`<button data-cov="${v}" aria-pressed="${fcov===v}">${l}</button>`).join("")}<span class="sep"></span>
 ${[["all","All letters"],["S","Stories"],["A","Artifacts"],["V","Values"],["E","Events"],["R","Roles"],["Z","Sustain"]].map(([v,l])=>`<button data-cl="${v}" aria-pressed="${fcl===v}">${l}</button>`).join("")}</div>`;
 if(view==="q")h+=qs.map(card).join("")||'<p class="note">No questions match these filters. Choose "All" to reset.</p>';
 else{const keys=Object.keys(D.principles);
  for(const k of keys){const m=qs.filter(x=>x.p.includes(k==="—"?k:+k)||(x.pairs||[]).some(r=>String(r[2])===k));
   if(!m.length)continue;
   h+=`<section class="pblock"><h3><span>${k==="—"?"—":"#"+k}</span> ${esc(D.principles[k])}</h3><div class="cnt">${m.length} question${m.length>1?"s":""}</div><div class="mini">${m.map(x=>`<a class="${x.cov}" href="#q${x.n}" data-jump="${x.n}">Q${x.n}</a>`).join("")}</div></section>`}}
 const app=document.getElementById("app");app.innerHTML=h;
 app.querySelectorAll("[data-view]").forEach(e=>e.onclick=()=>{view=e.dataset.view;render()});
 app.querySelectorAll("[data-cov]").forEach(e=>e.onclick=()=>{fcov=e.dataset.cov;render()});
 app.querySelectorAll("[data-cl]").forEach(e=>e.onclick=()=>{fcl=e.dataset.cl;render()});
 app.querySelectorAll("[data-jump]").forEach(e=>e.onclick=ev=>{ev.preventDefault();view="q";fcov="all";fcl="all";render();document.getElementById("q"+e.dataset.jump).scrollIntoView()});
}
async function tryOpen(pass){try{D=await dec(pass);try{localStorage.setItem("sqk",pass)}catch(e){}document.getElementById("lock").hidden=true;document.getElementById("app").hidden=false;render();return true}catch(e){return false}}
(async()=>{const m=location.hash.match(/k=([^&]+)/);let saved=null;try{saved=localStorage.getItem("sqk")}catch(e){}
 if(m&&await tryOpen(decodeURIComponent(m[1])))return; if(saved&&await tryOpen(saved))return;
 document.getElementById("lock").hidden=false;
 const go=async()=>{if(!await tryOpen(document.getElementById("pw").value))document.getElementById("err").textContent="That passphrase doesn't open this page. Check your bookmarked link."};
 document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};})();
</script>
