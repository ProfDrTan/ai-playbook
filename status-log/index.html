<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Status Log — CP3405 TR3 (Claude/Prof private)</title>
<style>
  :root{
    --bg:#0B0E12; --panel:#12161C; --panel2:#171C23; --line:#262D37;
    --paper:#E9E5DA; --dim:#8B93A0; --gold:#C7A354; --teal:#3E8E88;
    --red:#C1584B; --green:#6FA96A; --amber:#E8A63C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--paper);font-family:-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
  .banner{background:#b3261e;color:#fff;padding:10px 18px;font-weight:700;font-size:13px}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;display:grid;grid-template-columns:210px 1fr;gap:28px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:24px}

  .rail{border-left:2px solid var(--line);padding-left:18px;position:sticky;top:20px;align-self:start}
  .rail-item{position:relative;padding:8px 0 20px;cursor:pointer;font-size:12.5px;color:var(--dim)}
  .rail-item::before{content:'';position:absolute;left:-24px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
  .rail-item.active{color:var(--paper);font-weight:600}
  .rail-item.active::before{background:var(--gold)}
  .rail-item .ts{display:block;font-family:monospace;font-size:11px}

  section.content{min-width:0}
  .snapshot-label{color:var(--gold);font-size:12px;font-family:monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}

  .team-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
  .team-name{font-size:17px;font-weight:700;margin-bottom:14px}

  .block-title{font-family:monospace;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:0.6px;margin:16px 0 8px;border-top:1px solid var(--line);padding-top:14px}
  .block-title:first-of-type{border-top:none;margin-top:0;padding-top:0}

  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:700px){.cols{grid-template-columns:1fr}}
  .metric-label{font-family:monospace;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
  .metric-val{font-size:20px;font-weight:700}
  .metric-sub{font-size:12px;color:var(--dim);margin-top:2px}
  .delta{font-family:monospace;font-size:12px;margin-left:6px}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--dim)}

  .top3{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .top3-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .top3-bar{height:6px;border-radius:3px;background:var(--teal)}
  .top3-row:first-child .top3-bar{background:var(--gold)}
  .top3-name{width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  .top3-count{font-family:monospace;font-size:11px;color:var(--dim);width:24px;text-align:right}
  .least-note{font-size:11px;color:var(--amber);margin-top:8px;font-style:italic}

  .fig-badge{display:inline-block;font-family:monospace;font-size:11px;padding:3px 9px;border-radius:10px;margin-bottom:6px}
  .fig-badge.active{background:rgba(111,169,106,0.15);color:var(--green);border:1px solid var(--green)}
  .fig-badge.empty{background:rgba(193,88,75,0.15);color:var(--red);border:1px solid var(--red)}
  .fig-note{font-size:11.5px;color:var(--dim)}

  /* Role heatmap */
  .role-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  @media(max-width:700px){.role-grid{grid-template-columns:repeat(3,1fr)}}
  .role-cell{border-radius:6px;padding:9px 10px;text-align:center;border:1px solid var(--line)}
  .role-cell .rname{font-family:monospace;font-size:11px;font-weight:700}
  .role-cell .rcount{font-size:17px;font-weight:800;margin:2px 0}
  .role-cell .rlast{font-size:9.5px;color:var(--dim)}
  .role-cell.dead{background:rgba(193,88,75,0.12);border-color:var(--red)}
  .role-cell.dead .rname{color:var(--red)}
  .role-cell.low{background:rgba(232,166,60,0.08);border-color:var(--amber)}
  .role-cell.ok{background:rgba(111,169,106,0.06);border-color:var(--green)}

  /* Git graph */
  .git-meta{font-size:12px;color:var(--dim);margin-bottom:10px}
  .git-meta b{color:var(--paper)}
  svg.graph{width:100%;display:block}
  .pr-label{font-size:10px;fill:var(--dim);font-family:monospace}
  .pr-label b{fill:var(--gold)}

  .empty-state{color:var(--dim);font-size:14px;padding:40px;text-align:center}
</style>
</head>
<body>
<div class="banner">⚠ PRIVATE — Prof Tan / Claude only. Not linked from any student-facing page.</div>
<div class="wrap">
  <div>
    <h1 style="margin-top:20px">Status Log</h1>
    <div class="sub">GitHub · Discord · FigJam, chronologically.</div>
    <div class="rail" id="rail"></div>
  </div>
  <section class="content" id="content"><div class="empty-state">Loading…</div></section>
</div>

<script>
async function load() {
  const res = await fetch('history.json', {cache: 'no-store'});
  const history = await res.json();
  const rail = document.getElementById('rail');
  const content = document.getElementById('content');
  if (!history.length) { content.innerHTML = '<div class="empty-state">No status checks logged yet.</div>'; return; }

  function fmtTs(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('en-SG', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  }
  function daysSince(ts) {
    if (!ts) return null;
    return Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
  }
  function deltaSpan(curr, prev) {
    if (prev === undefined || prev === null) return '<span class="delta flat">baseline</span>';
    const d = curr - prev;
    if (d > 0) return `<span class="delta up">▲ +${d}</span>`;
    if (d < 0) return `<span class="delta down">▼ ${d}</span>`;
    return '<span class="delta flat">— no change</span>';
  }

  function roleCell(rname, r) {
    let cls = 'ok';
    if (!r || r.commits === 0) cls = 'dead';
    else if (r.commits <= 2) cls = 'low';
    const count = r ? r.commits : 0;
    const label = (!r || r.commits === 0) ? 'NO ACTIVITY' : `${count} commit${count===1?'':'s'}`;
    return `<div class="role-cell ${cls}">
      <div class="rname">${rname}</div>
      <div class="rcount">${count===0?'—':count}</div>
      <div class="rlast">${r && r.last ? fmtTs(r.last) : 'never'}</div>
    </div>`;
  }

  function gitGraphSvg(ga, teamName) {
    const w = 760, laneH = 34, mainY = 40;
    if (ga.workflow === 'direct-to-main') {
      return `<svg class="graph" viewBox="0 0 ${w} 70">
        <line x1="20" y1="35" x2="${w-20}" y2="35" stroke="var(--line)" stroke-width="3"/>
        ${[...Array(10)].map((_,i)=>`<circle cx="${30+i*(w-60)/9}" cy="35" r="4" fill="var(--dim)"/>`).join('')}
        <text x="20" y="60" class="pr-label">main only — no feature branches merged (${ga.branches_count} branch${ga.branches_count===1?'':'es'} total, 0 PRs)</text>
      </svg>`;
    }
    const prs = ga.merged_prs;
    const n = prs.length;
    const spacing = (w - 80) / (n + 1);
    let arcs = '';
    let labels = '';
    prs.forEach((pr, i) => {
      const x = 40 + spacing * (i + 1);
      const y2 = mainY - 28 - (i % 2) * 14;
      arcs += `<path d="M ${x-18},${mainY} Q ${x},${y2} ${x+18},${mainY}" fill="none" stroke="var(--gold)" stroke-width="2.5" opacity="0.85"/>`;
      arcs += `<circle cx="${x}" cy="${mainY}" r="4" fill="var(--gold)"/>`;
      labels += `<text x="${x}" y="${y2-6}" class="pr-label" text-anchor="middle"><tspan><b>#${pr.number}</b> ${pr.branch}</tspan></text>`;
      labels += `<text x="${x}" y="${mainY+16}" class="pr-label" text-anchor="middle" font-size="9">${pr.author}</text>`;
    });
    return `<svg class="graph" viewBox="0 0 ${w} 110">
      <line x1="20" y1="${mainY}" x2="${w-20}" y2="${mainY}" stroke="var(--line)" stroke-width="3"/>
      ${arcs}
      ${labels}
      <text x="20" y="100" class="pr-label">main</text>
    </svg>`;
  }

  function renderSnapshot(idx) {
    const snap = history[idx];
    const prev = idx > 0 ? history[idx - 1] : null;
    document.querySelectorAll('.rail-item').forEach((el, i) => el.classList.toggle('active', i === idx));

    let html = `<div class="snapshot-label">${snap.label || 'Status check'} — ${fmtTs(snap.timestamp)}</div>`;

    for (const [name, t] of Object.entries(snap.teams)) {
      const pt = prev ? prev.teams[name] : null;
      const ghPrev = pt ? pt.github.commits_total : null;
      const dcPrev = pt ? pt.discord.msg_count : null;
      const figChanged = pt && pt.figjam.status !== t.figjam.status;
      const roleOrder = ['R1','R2','R3','R4','R5','R6'];
      const deadRoles = roleOrder.filter(r => !t.roles[r] || t.roles[r].commits === 0);

      html += `<div class="team-card">
        <div class="team-name">${name}</div>

        <div class="block-title">Role Activity — R1 through R6${deadRoles.length ? ` <span style="color:var(--red)">· ${deadRoles.join(', ')} untouched</span>` : ''}</div>
        <div class="role-grid">
          ${roleOrder.map(r => roleCell(r, t.roles[r])).join('')}
        </div>

        <div class="block-title">Git Workflow</div>
        <div class="git-meta"><b>${t.git_activity.workflow === 'branch+PR' ? 'Branch + PR workflow' : 'Direct-to-main'}</b> · ${t.git_activity.merged_prs.length} PR${t.git_activity.merged_prs.length===1?'':'s'} merged · ${t.git_activity.branches_count} branch${t.git_activity.branches_count===1?'':'es'}</div>
        ${gitGraphSvg(t.git_activity, name)}

        <div class="block-title">Overview</div>
        <div class="cols">
          <div>
            <div class="metric-label">GitHub</div>
            <div class="metric-val">${t.github.commits_total}${deltaSpan(t.github.commits_total, ghPrev)}</div>
            <div class="metric-sub">${t.github.contributors} contributors · last push ${fmtTs(t.github.latest_push)}</div>
          </div>
          <div>
            <div class="metric-label">Discord</div>
            <div class="metric-val">${t.discord.msg_count}${deltaSpan(t.discord.msg_count, dcPrev)}</div>
            <div class="metric-sub">${t.discord.members} members</div>
            <div class="top3">
              ${t.discord.top3.map(m => `
                <div class="top3-row">
                  <div class="top3-name">${m.name}</div>
                  <div class="top3-bar" style="width:${Math.max(6, m.count / t.discord.top3[0].count * 60)}px"></div>
                  <div class="top3-count">${m.count}</div>
                </div>`).join('')}
            </div>
            ${t.discord.least_active_note ? `<div class="least-note">${t.discord.least_active_note}</div>` : ''}
          </div>
          <div>
            <div class="metric-label">FigJam</div>
            <span class="fig-badge ${t.figjam.status}">${t.figjam.status.toUpperCase()}${figChanged ? ' · CHANGED' : ''}</span>
            <div class="fig-note">${t.figjam.note}</div>
          </div>
        </div>
      </div>`;
    }
    content.innerHTML = html;
  }

  rail.innerHTML = history.map((s, i) =>
    `<div class="rail-item" data-idx="${i}"><span class="ts">${fmtTs(s.timestamp)}</span>${s.label || ''}</div>`
  ).join('');
  rail.querySelectorAll('.rail-item').forEach(el => {
    el.addEventListener('click', () => renderSnapshot(parseInt(el.dataset.idx)));
  });
  renderSnapshot(history.length - 1);
}
load().catch(e => {
  document.getElementById('content').innerHTML = '<div class="empty-state">Could not load history.json — ' + e.message + '</div>';
});
</script>
</body>
</html>
